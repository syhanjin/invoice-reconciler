[package]
name = "invoice-reconciler"
version = "0.1.1"
description = "Local order OCR and invoice matching assistant"
authors = ["syhanjin"]
edition = "2024"

[lib]
name = "invoice_reconciler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hmac = "0.12"
hex = "0.4"
infer = "0.19"
imagesize = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.36"
printpdf = { version = "0.12", default-features = false, features = ["bmp", "gif", "png", "jpeg", "tiff", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "1"
rust_xlsxwriter = "0.96"
sea-orm = { version = "1.1", features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
axum = "0.8"
tauri = { version = "2", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
