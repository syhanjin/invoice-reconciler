name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  SCCACHE_CACHE_SIZE: 1G
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-v1-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-v1-${{ runner.os }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore Cargo packages
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ matrix.target }}-

      - name: Restore Rust target
        id: target-cache
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/target
          key: target-v2-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            target-v2-${{ runner.os }}-${{ matrix.target }}-

      - name: Restore sccache
        id: sccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v2-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            sccache-v2-${{ runner.os }}-${{ matrix.target }}-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        if: runner.os == 'Linux'
        run: bun run lint

      - name: Test frontend
        if: runner.os == 'Linux'
        run: bun run test

      - name: Build Tauri application
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/assert-windows-gui.ps1 -Path "src-tauri/target/${{ matrix.target }}/release/invoice-reconciler.exe"

      - name: Show sccache statistics
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      - name: Stop sccache server
        shell: bash
        run: ${SCCACHE_PATH} --stop-server || true

      - name: Save Cargo packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Save Rust target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/target
          key: target-v2-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}

      - name: Save sccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v2-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}

  cleanup-cache:
    name: Retain recent build caches
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old target and sccache snapshots
        uses: actions/github-script@v7
        with:
          script: |
            const prefixes = [
              'target-v2-Linux-x86_64-unknown-linux-gnu-',
              'target-v2-Windows-x86_64-pc-windows-msvc-',
              'sccache-v2-Linux-x86_64-unknown-linux-gnu-',
              'sccache-v2-Windows-x86_64-pc-windows-msvc-',
            ];

            for (const key of prefixes) {
              const response = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/heads/main',
                key,
                sort: 'created_at',
                direction: 'desc',
                per_page: 100,
              });

              for (const cache of response.data.actions_caches.slice(2)) {
                core.info(`Deleting ${cache.key} (${cache.id})`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
              }
            }
