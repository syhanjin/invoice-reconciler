name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  SCCACHE_CACHE_SIZE: 1G
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-v1-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-v1-${{ runner.os }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore Cargo packages
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ matrix.target }}-

      - name: Restore Rust target
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/target
          key: target-v2-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            target-v2-${{ runner.os }}-${{ matrix.target }}-

      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v2-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            sccache-v2-${{ runner.os }}-${{ matrix.target }}-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri application
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/assert-windows-gui.ps1 -Path "src-tauri/target/${{ matrix.target }}/release/invoice-reconciler.exe"

      - name: Show sccache statistics
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      - name: Collect Linux release assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="artifacts"
          release_dir="src-tauri/target/${{ matrix.target }}/release"
          mkdir -p "$artifact_dir"

          cp "$release_dir/invoice-reconciler" \
            "$artifact_dir/invoice-reconciler-${{ matrix.platform }}-${GITHUB_REF_NAME}"

          deb_path="$(find "$release_dir/bundle/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_path"
          cp "$deb_path" \
            "$artifact_dir/invoice-reconciler-${{ matrix.platform }}-${GITHUB_REF_NAME}.deb"

      - name: Collect Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = "artifacts"
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Copy-Item -Path "$releaseDir/invoice-reconciler.exe" -Destination "$artifactDir/invoice-reconciler-${{ matrix.platform }}-${{ github.ref_name }}.exe"

          $installer = Get-ChildItem -Path "$releaseDir/bundle/nsis" -Filter "*.exe" |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }
          Copy-Item -Path $installer.FullName -Destination "$artifactDir/invoice-reconciler-${{ matrix.platform }}-${{ github.ref_name }}-setup.exe"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: invoice-reconciler-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: invoice-reconciler-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
